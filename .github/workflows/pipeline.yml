name: Acontece Ja Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aconteceja-pipeline
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: "true"
      NEWS_LOOKBACK_HOURS: "24"
      NEWS_LIMIT: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: aconteceja-automacao
          workload_identity_provider: projects/798640632443/locations/global/workloadIdentityPools/aconteceja-github/providers/github-actions
          service_account: aconteceja-github@aconteceja-automacao.iam.gserviceaccount.com

      - name: Confirm Google authentication
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Google Cloud OIDC authentication established."

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Run safe pipeline
        run: npm start
      - name: Preserve generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aconteceja-media
          path: output/media/
          if-no-files-found: ignore
          retention-days: 3
