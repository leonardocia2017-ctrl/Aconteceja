name: Acontece Ja Pipeline

on:
  workflow_dispatch:
    inputs:
      media_probe:
        description: "Testar somente upload/validação da ponte GitHub (sem publicar)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: aconteceja-pipeline
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: "true"
      NEWS_LOOKBACK_HOURS: "24"
      NEWS_LIMIT: "10"
      METRICOOL_MEDIA_BUCKET: ${{ vars.METRICOOL_MEDIA_BUCKET }}
      METRICOOL_MEDIA_BASE_URL: ${{ vars.METRICOOL_MEDIA_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: aconteceja-automacao
          workload_identity_provider: projects/798640632443/locations/global/workloadIdentityPools/aconteceja-github/providers/github-actions
          service_account: aconteceja-github@aconteceja-automacao.iam.gserviceaccount.com

      - name: Confirm Google authentication
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "Google Cloud OIDC authentication established."

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Run safe pipeline
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.media_probe != true }}
        run: npm start

      - name: Probe GitHub media bridge (no social publication)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.media_probe == true) || github.event_name == 'push' }}
        env:
          DRY_RUN: "false"
          METRICOOL_AUTO_PUBLISH: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { createMedia } from "./src/services/media.js";
          import { materializeMediaForMetricool } from "./src/services/publisher.js";
          const media = await createMedia({title:"Teste técnico de mídia — não publicar",category:"geral",source:"Acontece Já",sourceUrl:`probe://${process.env.GITHUB_RUN_ID}`});
          const ready = await materializeMediaForMetricool(media,{upload:true});
          console.log("MEDIA_BRIDGE_OK", ready.publicUrl, ready.size);
          NODE
      - name: Preserve generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aconteceja-media
          path: output/media/
          if-no-files-found: ignore
          retention-days: 3
